<header class="app-header" id="brioche">
  <a data-route="sweet" class="icon-btn" aria-label="Назад">
    <span class="iconify" data-icon="tabler:arrow-left"></span>
  </a>
  <div class="app-brand">
    <h1 class="page-title">Бріош</h1>
  </div>
  <span class="icon-btn"></span>
</header>

<main class="recipe-page">

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Режим вводу</span>
      <div class="segmented" id="entry-toggle">
        <button class="segmented-item is-active" data-entry="total">За тістом</button>
        <button class="segmented-item" data-entry="flour">За мукою</button>
        <button class="segmented-item" data-entry="portions">Порції</button>
      </div>
    </div>

    <div class="field-row" id="row-total">
      <label for="input-total" class="field-label">Загальна вага тіста</label>
      <div class="value-box value-box-accent">
        <input type="number" id="input-total" value="1000" step="10" min="0">
        <span class="value-unit">г</span>
      </div>
    </div>

    <div class="field-row" id="row-flour" style="display:none">
      <label for="input-flour" class="field-label">Вага муки</label>
      <div class="value-box value-box-accent">
        <input type="number" id="input-flour" value="450" step="10" min="0">
        <span class="value-unit">г</span>
      </div>
    </div>

    <div class="field-row" id="row-portions" style="display:none">
      <label for="input-portions" class="field-label">Кількість заготовок</label>
      <div class="value-box value-box-accent">
        <input type="number" id="input-portions" value="6" step="1" min="1">
        <span class="value-unit">шт</span>
      </div>
    </div>

    <div class="field-row" id="row-portion-weight" style="display:none">
      <label for="input-portion-weight" class="field-label">Вага 1 заготовки</label>
      <div class="value-box value-box-accent">
        <input type="number" id="input-portion-weight" value="150" step="10" min="0">
        <span class="value-unit">г</span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Преферемент</span>
    </div>

    <div class="field-row">
      <label for="select-preferment" class="field-label">Тип</label>
      <select id="select-preferment" class="value-box" style="border:none;">
        <option value="none" selected>Без преферменту</option>
        <option value="poolish">Пулиш</option>
        <option value="biga">Біга</option>
      </select>
    </div>

    <div class="field-row" id="row-pre-percent" style="display:none">
      <label for="input-pre-percent" class="field-label">% від загальної муки</label>
      <div class="value-box value-box-accent">
        <input type="number" id="input-pre-percent" value="20" step="1" min="0" max="100">
        <span class="value-unit">%</span>
      </div>
    </div>

    <div class="hr" id="pre-hr" style="display:none"></div>

    <div class="row-list" id="pre-breakdown" style="display:none">
      <div class="row-list-header">
        <span>Склад преферменту</span>
        <span>Вага</span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/flour.png" alt="" class="row-list-icon">Мука</div>
        <span class="row-list-value" id="pre-flour">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/water.png" alt="" class="row-list-icon">Вода</div>
        <span class="row-list-value" id="pre-water">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon" id="pre-third-icon">Дріжджі/закваска</div>
        <span class="row-list-value" id="pre-third">0 <span class="unit">г</span></span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Baker's Percentages</span>
    </div>

    <div class="field-row">
      <label class="field-label"><img src="img/icons/milk.png" alt="" class="row-list-icon"> Гідратація (молоко)</label>
      <div class="value-box value-box-accent">
        <input type="number" id="pct-hydration" value="20" step="1" min="0">
        <span class="value-unit">%</span>
      </div>
    </div>
    <input type="range" id="rng-hydration" min="0" max="100" value="20" step="1" class="pct-slider pct-slider-water">

    <div class="field-row">
      <label class="field-label"><img src="img/icons/salt.png" alt="" class="row-list-icon"> Сіль</label>
      <div class="value-box value-box-accent">
        <input type="number" id="pct-salt" value="1.8" step="0.1" min="0">
        <span class="value-unit">%</span>
      </div>
    </div>
    <input type="range" id="rng-salt" min="0" max="4" value="1.8" step="0.1" class="pct-slider pct-slider-salt">

    <div class="field-row">
      <label class="field-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon"> Дріжджі</label>
      <div class="value-box value-box-accent">
        <input type="number" id="pct-yeast" value="3" step="0.1" min="0">
        <span class="value-unit">%</span>
      </div>
    </div>
    <input type="range" id="rng-yeast" min="0" max="6" value="3" step="0.1" class="pct-slider pct-slider-yeast">

    <div class="field-row">
      <label class="field-label"><img src="img/icons/sugar.png" alt="" class="row-list-icon"> Цукор</label>
      <div class="value-box value-box-accent">
        <input type="number" id="pct-sugar" value="15" step="0.5" min="0">
        <span class="value-unit">%</span>
      </div>
    </div>
    <input type="range" id="rng-sugar" min="0" max="30" value="15" step="0.5" class="pct-slider pct-slider-oil">

    <div class="field-row">
      <label class="field-label"><img src="img/icons/eggs.png" alt="" class="row-list-icon"> Яйця</label>
      <div class="value-box value-box-accent">
        <input type="number" id="pct-egg" value="40" step="1" min="0">
        <span class="value-unit">%</span>
      </div>
    </div>
    <input type="range" id="rng-egg" min="0" max="80" value="40" step="1" class="pct-slider pct-slider-yeast">

    <div class="field-row">
      <label class="field-label"><img src="img/icons/butter.png" alt="" class="row-list-icon"> Масло вершкове</label>
      <div class="value-box value-box-accent">
        <input type="number" id="pct-butter" value="45" step="1" min="0">
        <span class="value-unit">%</span>
      </div>
    </div>
    <input type="range" id="rng-butter" min="0" max="80" value="45" step="1" class="pct-slider pct-slider-oil">
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Основний заміс</span>
    </div>
    <div class="row-list">
      <div class="row-list-header">
        <span>Інгредієнт</span>
        <span>Вага</span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/flour.png" alt="" class="row-list-icon">Мука</div>
        <span class="row-list-value" id="main-flour">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/milk.png" alt="" class="row-list-icon">Молоко</div>
        <span class="row-list-value" id="main-water">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/salt.png" alt="" class="row-list-icon">Сіль</div>
        <span class="row-list-value" id="main-salt">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon">Дріжджі</div>
        <span class="row-list-value" id="main-yeast">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/sugar.png" alt="" class="row-list-icon">Цукор</div>
        <span class="row-list-value" id="main-sugar">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/eggs.png" alt="" class="row-list-icon">Яйця</div>
        <span class="row-list-value" id="main-egg">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/butter.png" alt="" class="row-list-icon">Масло вершкове</div>
        <span class="row-list-value" id="main-butter">0 <span class="unit">г</span></span>
      </div>
    </div>

    <div class="summary-box">
      <span>Загальна вага тіста</span>
      <strong id="out-total-dough">0 г</strong>
    </div>
  </section>

</main>
