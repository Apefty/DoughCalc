<header class="app-header" id="italian">
  <a data-route="" class="icon-btn" aria-label="{{lang.BACK}}">
    <span class="iconify" data-icon="tabler:arrow-left"></span>
  </a>
  <div class="app-brand">
    <h1 class="page-title">{{lang.ITALIAN_DOUGH}}</h1>
  </div>
  <button class="icon-btn" id="menu-btn" aria-label="{{lang.MENU}}">
    <span class="iconify" data-icon="tabler:menu-2"></span>
  </button>
</header>

<div class="home-search-wrap">
  <div class="search-box">
    <span class="si"><span class="iconify" data-icon="tabler:search"></span></span>
    <input type="text" id="home-search-input" placeholder="{{lang.SEARCH_PLACEHOLDER}}" autocomplete="off">
    <span class="sclr" id="home-search-clear" aria-label="{{lang.SEARCH_CLOSE}}">&times;</span>
  </div>
</div>
<div id="search-results" class="search-results"></div>


<main class="menu">

  <nav class="menu-grid" aria-label="{{lang.ITALIAN_DOUGH}}">

    <a data-route="italian/pizza" class="menu-card" data-cat="pizza">
      <img src="img/icons/pizza.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.PIZZA_HUB}}</span>
        <span class="menu-card-sub">{{lang.PIZZA_HUB_SUB}}</span>
      </div>
    </a>

    <a data-route="italian/ciabatta" class="menu-card" data-cat="ciabatta">
      <img src="img/icons/pizza.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.CIABATTA}}</span>
        <span class="menu-card-sub">{{lang.CIABATTA_SUB}}</span>
      </div>
    </a>

    <a data-route="italian/focaccia" class="menu-card" data-cat="focaccia">
      <img src="img/icons/pizza.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.FOCACCIA}}</span>
        <span class="menu-card-sub">{{lang.FOCACCIA_SUB}}</span>
      </div>
    </a>

    <a data-route="italian/pasta" class="menu-card" data-cat="pasta">
      <img src="img/icons/dough.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.PASTA}}</span>
        <span class="menu-card-sub">{{lang.PASTA_SUB}}</span>
      </div>
    </a>

    <a data-route="italian/batters" class="menu-card" data-cat="batters">
      <img src="img/icons/dough.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.BATTER}}</span>
        <span class="menu-card-sub">{{lang.BATTER_SUB}}</span>
      </div>
    </a>

  </nav>

</main>
