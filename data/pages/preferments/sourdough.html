<header class="app-header" id="sourdough">
  <a data-route="preferments" class="icon-btn" aria-label="Назад">
    <span class="iconify" data-icon="tabler:arrow-left"></span>
  </a>
  <div class="app-brand">
    <h1 class="page-title">Закваска (Sourdough)</h1>
  </div>
  <span class="icon-btn"></span>
</header>

<main class="recipe-page">

  <section class="card hero-card">
    <div class="hero-card-top" id="hero-pills"></div>
    <p class="hero-desc" id="hero-desc"></p>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Розрахунок</span>
      <div class="segmented" id="mode-toggle">
        <button class="segmented-item is-active" data-mode="flour">За мукою</button>
        <button class="segmented-item" data-mode="total">За тістом</button>
      </div>
    </div>

    <div class="field-row">
      <label for="input-weight" class="field-label" id="input-label">Вага муки</label>
      <div class="value-box value-box-accent">
        <input type="number" id="input-weight" value="300" step="1" min="0">
        <span class="value-unit">г</span>
      </div>
    </div>

    <div class="hr"></div>

    <div class="row-list">
      <div class="row-list-header">
        <span>Склад</span>
        <span>Вага</span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/flour.png" alt="" class="row-list-icon">Борошно</div>
        <span class="row-list-value" id="out-flour">– <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/water.png" alt="" class="row-list-icon">Вода</div>
        <span class="row-list-value" id="out-water">– <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label" id="third-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon" id="third-icon">Дріжджі</div>
        <span class="row-list-value" id="out-third">– <span class="unit">г</span></span>
      </div>
    </div>

    <div class="summary-box">
      <span>Загальна вага преферменту</span><br>
      <strong id="out-total">– г</strong>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Ферментація</span>
    </div>
    <div class="row-list">
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/hourglass.png" alt="" class="row-list-icon">Тривалість</div>
        <span class="row-list-value" id="ferment-duration"></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/temperature.png" alt="" class="row-list-icon">Температура</div>
        <span class="row-list-value" id="ferment-temp"></span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Використовується в</span>
    </div>
    <div class="tag-row" id="used-in-tags"></div>
  </section>

</main>
