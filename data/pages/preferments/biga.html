<header class="app-header" id="biga">
  <a data-route="preferments" class="icon-btn" aria-label="Назад">
    <span class="iconify" data-icon="tabler:arrow-left"></span>
  </a>
  <div class="app-brand">
    <h1 class="page-title">{{lang.BIGA}}</h1>
  </div>
  <button class="icon-btn" id="menu-btn" aria-label="{{lang.MENU}}">
    <span class="iconify" data-icon="tabler:menu-2"></span>
  </button>
</header>

<main class="recipe-page">

  <section class="card hero-card">
    <div class="hero-card-top" id="hero-pills"></div>
    <p class="hero-desc" id="hero-desc"></p>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">{{lang.CALCULATION}}</span>
      <div class="segmented" id="mode-toggle">
        <button class="segmented-item is-active" data-mode="flour">За борошном</button>
        <button class="segmented-item" data-mode="total">За тістом</button>
      </div>
    </div>

    <div class="field-row">
      <label for="input-weight" class="field-label" id="input-label">{{lang.FLOUR_WEIGHT}}</label>
      <div class="value-box value-box-accent">
        <input type="number" id="input-weight" value="300" step="1" min="0">
        <span class="value-unit">г</span>
      </div>
    </div>

    <div class="hr"></div>

    <div class="row-list">
      <div class="row-list-header">
        <span>{{lang.COMPOSITION}}</span>
        <span>{{lang.WEIGHT}}</span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/flour.png" alt="" class="row-list-icon">{{lang.FLOUR}}</div>
        <span class="row-list-value" id="out-flour">– <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/water.png" alt="" class="row-list-icon">{{lang.WATER}}</div>
        <span class="row-list-value" id="out-water">– <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label" id="third-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon" id="third-icon">{{lang.YEAST}}</div>
        <span class="row-list-value" id="out-third">– <span class="unit">г</span></span>
      </div>
    </div>

    <div class="summary-box">
      <span>{{lang.TOTAL_PREFERMENT_WEIGHT}}</span><br>
      <strong id="out-total">– г</strong>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">{{lang.FERMENTATION}}</span>
    </div>
    <div class="row-list">
      <div class="row-list-item">
              <div class="row-list-label"><img src="img/icons/hourglass.png" alt="" class="row-list-icon">{{lang.DURATION}}</div>
        <span class="row-list-value" id="ferment-duration"></span>
      </div>
      <div class="row-list-item">
      <div class="row-list-label"><img src="img/icons/temperature.png" alt="" class="row-list-icon">{{lang.TEMPERATURE}}</div>
        <span class="row-list-value" id="ferment-temp"></span>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">{{lang.USED_IN}}</span>
    </div>
    <div class="tag-row" id="used-in-tags"></div>
  </section>

  <section class="card">
    <div class="card-title-row"><span class="card-title">{{lang.LINKS}}</span></div>
    <div class="field-row">
      <label for="link-youtube" class="field-label">{{lang.YOUTUBE_VIDEO}}</label>
      <div class="value-box"><input type="url" id="link-youtube" placeholder="https://..."></div>
    </div>
    <div class="field-row">
      <label for="link-recipe" class="field-label">{{lang.RECIPE_LINK}}</label>
      <div class="value-box"><input type="url" id="link-recipe" placeholder="https://..."></div>
    </div>
  </section>

</main>
