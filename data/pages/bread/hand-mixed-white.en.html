<header class="app-header" id="bread-handmixedwhite">
  <a data-route="bread" class="icon-btn" aria-label="Back">
    <span class="iconify" data-icon="tabler:arrow-left"></span>
  </a>
  <div class="app-brand">
    <h1 class="page-title">Hand-Mixed White</h1>
  </div>
  <span class="icon-btn"></span>
</header>

<main class="recipe-page">

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Entry mode</span>
      <div class="segmented" id="entry-toggle">
        <button class="segmented-item is-active" data-entry="total">By dough</button>
        <button class="segmented-item" data-entry="flour">By flour</button>
        <button class="segmented-item" data-entry="portions">Portions</button>
      </div>
    </div>
    <div class="field-row" id="row-total">
      <label for="input-total" class="field-label">Total dough weight</label>
      <div class="value-box value-box-accent"><input type="number" id="input-total" value="1000" step="10" min="0"><span class="value-unit">g</span></div>
    </div>
    <div class="field-row" id="row-flour" style="display:none">
      <label for="input-flour" class="field-label">Flour weight</label>
      <div class="value-box value-box-accent"><input type="number" id="input-flour" value="600" step="10" min="0"><span class="value-unit">g</span></div>
    </div>
    <div class="field-row" id="row-portions" style="display:none">
      <label for="input-portions" class="field-label">Number of pieces</label>
      <div class="value-box value-box-accent"><input type="number" id="input-portions" value="2" step="1" min="1"><span class="value-unit">pcs</span></div>
    </div>
    <div class="field-row" id="row-portion-weight" style="display:none">
      <label for="input-portion-weight" class="field-label">Weight per piece</label>
      <div class="value-box value-box-accent"><input type="number" id="input-portion-weight" value="700" step="10" min="0"><span class="value-unit">g</span></div>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row"><span class="card-title">Baker's Percentages</span></div>
    <div class="field-row">
      <label class="field-label"><img src="img/icons/water.png" alt="" class="row-list-icon"> Hydration</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-hydration"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-hydration" class="pct-slider pct-slider-hydration">
    <div class="field-row">
      <label class="field-label"><img src="img/icons/salt.png" alt="" class="row-list-icon"> Salt</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-salt"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-salt" class="pct-slider pct-slider-salt">
    <div class="field-row">
      <label class="field-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon"> Yeast (main dough)</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-yeast"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-yeast" class="pct-slider pct-slider-yeast">

  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Flour types</span>
      <button class="icon-btn" id="add-flour-type" aria-label="Add type" style="width:32px;height:32px;">
        <span class="iconify" data-icon="tabler:plus"></span>
      </button>
    </div>
    <div id="flour-types-list"></div>
    <div class="summary-box" id="flour-sum-box" style="margin-top:12px;">
      <span>Sum of shares</span><br><strong id="flour-sum">100%</strong>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row"><span class="card-title">Main dough</span></div>
    <div class="row-list">
      <div class="row-list-header"><span>Ingredient</span><span>Weight</span></div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/flour.png" alt="" class="row-list-icon">Flour</div>
        <span class="row-list-value" id="main-flour">0 <span class="unit">g</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/water.png" alt="" class="row-list-icon">Hydration</div>
        <span class="row-list-value" id="main-water">0 <span class="unit">g</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/salt.png" alt="" class="row-list-icon">Salt</div>
        <span class="row-list-value" id="main-salt">0 <span class="unit">g</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon">Yeast (main dough)</div>
        <span class="row-list-value" id="main-yeast">0 <span class="unit">g</span></span>
      </div>

    </div>
    <div class="summary-box">
      <span>Total dough weight</span><br><strong id="out-total-dough">0 g</strong>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row"><span class="card-title">Links</span></div>
    <div class="field-row">
      <label for="link-youtube" class="field-label">Youtube video</label>
      <div class="value-box"><input type="url" id="link-youtube" placeholder="https://..."></div>
    </div>
    <div class="field-row">
      <label for="link-recipe" class="field-label">Recipe</label>
      <div class="value-box"><input type="url" id="link-recipe" placeholder="https://..."></div>
    </div>
  </section>

</main>
