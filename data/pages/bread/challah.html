<header class="app-header" id="bread-challah">
  <a data-route="bread" class="icon-btn" aria-label="Назад">
    <span class="iconify" data-icon="tabler:arrow-left"></span>
  </a>
  <div class="app-brand">
    <h1 class="page-title">Challah</h1>
    <button class="favorite-btn" data-favorite-toggle aria-label="{{lang.FAVORITE_ADD}}" aria-pressed="false">
      <span class="iconify" data-icon="tabler:heart"></span>
    </button>
  </div>
  <button class="icon-btn" id="menu-btn" aria-label="{{lang.MENU}}">
    <span class="iconify" data-icon="tabler:menu-2"></span>
  </button>
</header>

<main class="recipe-page">

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Режим вводу</span>
      <div class="segmented" id="entry-toggle">
        <button class="segmented-item is-active" data-entry="total">За тістом</button>
        <button class="segmented-item" data-entry="flour">За борошном</button>
        <button class="segmented-item" data-entry="portions">Порції</button>
      </div>
    </div>
    <div class="field-row" id="row-total">
      <label for="input-total" class="field-label">Загальна вага тіста</label>
      <div class="value-box value-box-accent"><input type="number" id="input-total" value="1000" step="10" min="0"><span class="value-unit">г</span></div>
    </div>
    <div class="field-row" id="row-flour" style="display:none">
      <label for="input-flour" class="field-label">Вага борошна</label>
      <div class="value-box value-box-accent"><input type="number" id="input-flour" value="600" step="10" min="0"><span class="value-unit">г</span></div>
    </div>
    <div class="field-row" id="row-portions" style="display:none">
      <label for="input-portions" class="field-label">Кількість заготовок</label>
      <div class="value-box value-box-accent"><input type="number" id="input-portions" value="2" step="1" min="1"><span class="value-unit">шт</span></div>
    </div>
    <div class="field-row" id="row-portion-weight" style="display:none">
      <label for="input-portion-weight" class="field-label">Вага 1 заготовки</label>
      <div class="value-box value-box-accent"><input type="number" id="input-portion-weight" value="700" step="10" min="0"><span class="value-unit">г</span></div>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row"><span class="card-title">Baker's Percentages</span></div>
    <div class="field-row">
      <label class="field-label"><img src="img/icons/water.png" alt="" class="row-list-icon"> Гідратація</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-hydration"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-hydration" class="pct-slider pct-slider-hydration">
    <div class="field-row">
      <label class="field-label"><img src="img/icons/salt.png" alt="" class="row-list-icon"> Сіль</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-salt"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-salt" class="pct-slider pct-slider-salt">
    <div class="field-row">
      <label class="field-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon"> Дріжджі (в основний заміс)</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-yeast"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-yeast" class="pct-slider pct-slider-yeast">
    <div class="field-row">
      <label class="field-label"><img src="img/icons/oil.png" alt="" class="row-list-icon"> Олія</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-oil"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-oil" class="pct-slider pct-slider-oil">
    <div class="field-row">
      <label class="field-label"><img src="img/icons/eggs.png" alt="" class="row-list-icon"> Яйця</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-egg"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-egg" class="pct-slider pct-slider-egg">
    <div class="field-row">
      <label class="field-label"><img src="img/icons/sugar.png" alt="" class="row-list-icon"> Цукор</label>
      <div class="value-box value-box-accent"><input type="number" id="pct-sugar"><span class="value-unit">%</span></div>
    </div>
    <input type="range" id="rng-sugar" class="pct-slider pct-slider-sugar">
  </section>

  <section class="card">
    <div class="card-title-row">
      <span class="card-title">Типи борошна</span>
      <button class="icon-btn" id="add-flour-type" aria-label="Додати тип" style="width:32px;height:32px;">
        <span class="iconify" data-icon="tabler:plus"></span>
      </button>
    </div>
    <div id="flour-types-list"></div>
    <div class="summary-box" id="flour-sum-box" style="margin-top:12px;">
      <span>Сума часток</span><br><strong id="flour-sum">100%</strong>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row"><span class="card-title">Основний заміс</span></div>
    <div class="row-list">
      <div class="row-list-header"><span>Інгредієнт</span><span>Вага</span></div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/flour.png" alt="" class="row-list-icon">Борошно</div>
        <span class="row-list-value" id="main-flour">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/water.png" alt="" class="row-list-icon">Гідратація</div>
        <span class="row-list-value" id="main-water">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/salt.png" alt="" class="row-list-icon">Сіль</div>
        <span class="row-list-value" id="main-salt">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/yeast.png" alt="" class="row-list-icon">Дріжджі (в основний заміс)</div>
        <span class="row-list-value" id="main-yeast">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/oil.png" alt="" class="row-list-icon">Олія</div>
        <span class="row-list-value" id="main-oil">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/eggs.png" alt="" class="row-list-icon">Яйця</div>
        <span class="row-list-value" id="main-egg">0 <span class="unit">г</span></span>
      </div>
      <div class="row-list-item">
        <div class="row-list-label"><img src="img/icons/sugar.png" alt="" class="row-list-icon">Цукор</div>
        <span class="row-list-value" id="main-sugar">0 <span class="unit">г</span></span>
      </div>
    </div>
    <div class="summary-box">
      <span>Загальна вага тіста</span><br><strong id="out-total-dough">0 г</strong>
    </div>
  </section>

  <section class="card">
    <div class="card-title-row"><span class="card-title">Посилання</span></div>
    <div class="field-row">
      <label for="link-youtube" class="field-label">Youtube video</label>
      <div class="value-box"><input type="url" id="link-youtube" placeholder="https://..."></div>
    </div>
    <div class="field-row">
      <label for="link-recipe" class="field-label">Recipe</label>
      <div class="value-box"><input type="url" id="link-recipe" placeholder="https://..."></div>
    </div>
  </section>

</main>
