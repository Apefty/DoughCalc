<header class="app-header" id="croissant">
  <a data-route="laminated" class="icon-btn" aria-label="{{lang.BACK}}">
    <span class="iconify" data-icon="tabler:arrow-left"></span>
  </a>
  <div class="app-brand">
    <h1 class="page-title">{{lang.CROISSANT}}</h1>
    <button class="favorite-btn" data-favorite-toggle aria-label="{{lang.FAVORITE_ADD}}" aria-pressed="false">
      <span class="iconify" data-icon="tabler:heart"></span>
    </button>
  </div>
  <button class="icon-btn" id="menu-btn" aria-label="{{lang.MENU}}">
    <span class="iconify" data-icon="tabler:menu-2"></span>
  </button>
</header>

<main class="menu">

  <nav class="menu-grid" aria-label="{{lang.CROISSANT}}">

    <a data-route="laminated/croissant/standard" class="menu-card" data-croissant="standard">
      <img src="img/icons/laminated.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.STANDARD}}</span>
        <span class="menu-card-sub">{{lang.STANDARD_SUB}}</span>
      </div>
    </a>

    <a data-route="laminated/croissant/choc" class="menu-card" data-croissant="choc">
      <img src="img/icons/laminated.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.CROISSANT_TWOTONE_CHOC}}</span>
        <span class="menu-card-sub">{{lang.CROISSANT_TWOTONE_CHOC_SUB}}</span>
      </div>
    </a>

    <a data-route="laminated/croissant/garlic-herb" class="menu-card" data-croissant="garlic-herb">
      <img src="img/icons/laminated.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.CROISSANT_GARLIC_HERB}}</span>
        <span class="menu-card-sub">{{lang.CROISSANT_GARLIC_HERB_SUB}}</span>
      </div>
    </a>

    <a data-route="laminated/croissant/flaky-rolls" class="menu-card" data-croissant="flaky-rolls">
      <img src="img/icons/laminated.png" alt="" class="menu-card-icon">
      <div class="menu-card-text">
        <span class="menu-card-title">{{lang.CROISSANT_FLAKY_ROLLS}}</span>
        <span class="menu-card-sub">{{lang.CROISSANT_FLAKY_ROLLS_SUB}}</span>
      </div>
    </a>

  </nav>

</main>
