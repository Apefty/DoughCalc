<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="SITE_TITLE">Калькулятор хлібопекарських рецептів</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
</head>
<body>
<div id="body-wrapper">

<div id="drawer-overlay"></div>

<aside id="side-drawer" aria-label="Бічне меню">
  <div class="drawer-header">
    <img src="img/icons/logo.png" alt="" class="drawer-logo">
    <span class="drawer-title" data-i18n="SITE_TITLE">Калькулятор хлібопекарських рецептів</span>
    <button class="icon-btn" id="drawer-close-btn" aria-label="Закрити меню">
      <span class="iconify" data-icon="tabler:x"></span>
    </button>
  </div>

  <nav class="drawer-nav" aria-label="Розділи">
    <a data-route="" class="drawer-link"><span class="iconify" data-icon="tabler:home"></span><span data-i18n="HOME">Головна</span></a>
    <a data-route="calculator" class="drawer-link"><span class="iconify" data-icon="tabler:calculator"></span><span data-i18n="CALCULATOR">Калькулятор</span></a>
    <a data-route="preferments" class="drawer-link"><span class="iconify" data-icon="tabler:flask"></span><span data-i18n="PREFERMENTS">Преферменти</span></a>
    <a data-route="bread" class="drawer-link"><span class="iconify" data-icon="tabler:bread"></span><span data-i18n="BREAD">Хліб</span></a>
    <a data-route="italian" class="drawer-link"><span class="iconify" data-icon="tabler:pizza"></span><span data-i18n="ITALIAN">Італійське тісто</span></a>
    <a data-route="baguette" class="drawer-link"><span class="iconify" data-icon="tabler:baguette"></span><span data-i18n="BAGUETTE">Багети</span></a>
    <a data-route="sweet" class="drawer-link"><span class="iconify" data-icon="tabler:cake"></span><span data-i18n="SWEET">Солодка випічка</span></a>
    <a data-route="laminated" class="drawer-link"><span class="iconify" data-icon="tabler:layers-intersect"></span><span data-i18n="LAMINATED">Шарувате тісто</span></a>
    <a data-route="enriched" class="drawer-link"><span class="iconify" data-icon="tabler:egg"></span><span data-i18n="ENRICHED">Збагачене тісто</span></a>
    <a data-route="flatbread" class="drawer-link"><span class="iconify" data-icon="tabler:pizza"></span><span data-i18n="FLATBREAD">Пласке тісто</span></a>
    <a data-route="technical" class="drawer-link"><span class="iconify" data-icon="tabler:certificate"></span><span data-i18n="TECHNICAL">Декоративне тісто</span></a>
  </nav>

  <div class="drawer-divider"></div>

  <div class="drawer-section">
    <div class="drawer-field">
      <label for="drawer-lang" data-i18n="LANGUAGE">Мова</label>
      <select id="drawer-lang">
        <option value="ua" data-i18n="LANGUAGE_UA">Українська</option>
        <option value="en" data-i18n="LANGUAGE_EN">English</option>
      </select>
    </div>
    <div class="drawer-field">
      <label for="drawer-theme" data-i18n="THEME">Тема</label>
      <select id="drawer-theme">
        <option value="light" data-i18n="THEME_LIGHT">Світла</option>
        <option value="dark" data-i18n="THEME_DARK">Темна</option>
      </select>
    </div>
    <div class="drawer-field">
      <label for="drawer-units" data-i18n="UNITS">Одиниці виміру</label>
      <select id="drawer-units">
        <option value="g" data-i18n="UNITS_GRAMS">Грами</option>
        <option value="oz" data-i18n="UNITS_OUNCES">Унції</option>
      </select>
    </div>
  </div>

  <div class="drawer-divider"></div>

  <nav class="drawer-nav" aria-label="Інше">
    <a data-route="settings" class="drawer-link"><span class="iconify" data-icon="tabler:settings"></span><span data-i18n="SETTINGS">Налаштування</span></a>
    <a data-route="about" class="drawer-link"><span class="iconify" data-icon="tabler:info-circle"></span><span data-i18n="ABOUT">Про додаток</span></a>
  </nav>
</aside>

<div id="content-area">
  <!-- cat.js loads the current route's fragment (pages/**/*.html) in here -->
</div>

<nav class="bottom-nav" aria-label="Нижня навігація">
  <a data-route="" data-nav="home" class="bottom-nav-item">
    <span class="iconify" data-icon="tabler:home"></span>
    <span data-i18n="HOME">Головна</span>
  </a>
  <a data-route="calculator" data-nav="calculator" class="bottom-nav-item">
    <span class="iconify" data-icon="tabler:calculator"></span>
    <span data-i18n="CALCULATOR">Калькулятор</span>
  </a>
  <a data-route="favorites" data-nav="favorites" class="bottom-nav-item">
    <span class="iconify" data-icon="tabler:heart"></span>
    <span data-i18n="FAVORITES">Обране</span>
  </a>
  <a data-route="about" data-nav="about" class="bottom-nav-item">
    <span class="iconify" data-icon="tabler:info-circle"></span>
    <span data-i18n="ABOUT">Про додаток</span>
  </a>
</nav>
</div>
<script src="data/calc.js"></script>
<script src="js/vendor/handlebars.min.js"></script>
<script src="data/lang/ua.js"></script>
<script src="data/lang/en.js"></script>
<script src="data/cat.js"></script>
<script src="data/app.js"></script>
<script src="ota.js"></script>
</body>
</html>
